name: Build Mod JAR

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
        
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      
    - name: Make gradlew executable
      working-directory: ./Donut-Algorithm
      run: chmod +x gradlew && ls -la gradlew
      
    - name: Build with Gradle
      working-directory: ./Donut-Algorithm
      run: ./gradlew build --stacktrace --info --no-daemon 2>&1 | tail -100
      
    - name: List build output
      working-directory: ./Donut-Algorithm
      run: ls -la build/libs/ 2>/dev/null || echo "No build/libs directory"
      
    - name: Upload JAR artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: donut-algorithm-mod
        path: Donut-Algorithm/build/libs/*.jar
        retention-days: 30
