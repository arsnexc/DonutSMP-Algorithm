name: Build Mod JAR

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
        
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Check Java version
      run: java -version && javac -version
      
    - name: List project structure
      run: ls -la Donut-Algorithm/
      
    - name: Check gradle wrapper
      working-directory: ./Donut-Algorithm
      run: |
        ls -la gradlew gradle/wrapper/
        cat gradle/wrapper/gradle-wrapper.properties
        
    - name: Build with Gradle (verbose)
      working-directory: ./Donut-Algorithm
      run: |
        chmod +x gradlew
        ./gradlew build --stacktrace 2>&1 | tee build.log
        echo "=== BUILD EXIT CODE: $? ==="
        echo "=== LAST 200 LINES ==="
        tail -200 build.log
        
    - name: Check build directory
      if: always()
      working-directory: ./Donut-Algorithm
      run: |
        echo "=== Build directory contents ==="
        find build -type f 2>/dev/null | head -50 || echo "No build directory"
        
    - name: Upload JAR artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: donut-algorithm-mod
        path: Donut-Algorithm/build/libs/*.jar
        retention-days: 30
        
    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: Donut-Algorithm/build.log
        retention-days: 7
